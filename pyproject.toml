[project]
name = "metroflow"
version = "0.0.2"
description = "Urban traffic simulator developer docs + starter skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jax",
  "jaxlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
