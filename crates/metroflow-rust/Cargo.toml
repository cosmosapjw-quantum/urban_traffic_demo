[package]
name = "metroflow-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "_metroflow_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", optional = true }
rayon = "1.10"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "0.10", optional = true }
libc = { version = "0.2", optional = true }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std","xz"], optional = true }

[features]
default = ["python-extension"]
python-extension = ["dep:pyo3", "pyo3/extension-module"]
native-cli = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:libc", "dep:lzma-rust2"]
# Diagnostic instrument only: counting allocator and observe-mode guards.
budget_trace = []

[[bin]]
name = "metroflow-native-run"
path = "src/bin/metroflow-native-run.rs"
required-features = ["native-cli"]

[[bin]]
name = "metroflow-frozen-road-audit"
path = "src/bin/metroflow-frozen-road-audit.rs"
required-features = ["native-cli"]

[[bin]]
name = "metroflow-frozen-prepare"
path = "src/bin/metroflow-frozen-prepare.rs"
required-features = ["native-cli"]

[[bin]]
name = "metroflow-v03-campaign"
path = "src/bin/metroflow-v03-campaign.rs"
required-features = ["native-cli"]

[[bin]]
name = "metroflow-feedback-audit"
path = "src/bin/metroflow-feedback-audit.rs"
required-features = ["native-cli"]
