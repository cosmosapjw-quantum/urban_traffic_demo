name: ci

# This repository had no CI. Every pin in it — artifact fingerprints, the
# morphology envelope, the replay contract — was enforced only by someone
# remembering to run pytest locally, which is how a control-table artifact ended
# up committed one commit before the module it scores.
#
# The default matrix stays dependency-free. Its shards retain the complete
# baseline suite without forcing the scale-heavy public contracts through one
# runner timeout. The OSMnx oracle needs ~28 MB of geo wheels to re-derive
# Boeing's definitions from an independent implementation, so it runs as its
# own job rather than taxing the default matrix.
# It is NOT opt-in: the instrument's headline claim is that OSMnx parity is
# checked rather than asserted, and a job nobody triggers leaves that claim
# exactly as unenforced as the assertion it replaced.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-partition:
    name: test partition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify partition and emit matrix
        id: partition
        run: |
          python tools/ci_test_partition.py --verify
          echo "matrix=$(python tools/ci_test_partition.py --matrix)" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.shard }})
    needs: test-partition
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-partition.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        if: matrix.lint
        run: python -m ruff check src tests tools

      # The NumPy path is authoritative; the Rust and JAX backends are optional
      # and are not built here. A test that silently falls back to NumPy when an
      # optional backend was explicitly selected is forbidden by the claim
      # ledger, so their absence must surface as a skip, never as a pass.
      - name: Verify partition and run tests
        run: |
          python tools/ci_test_partition.py --verify
          selection_file="$RUNNER_TEMP/test-files-${{ matrix.shard }}.nul"
          python tools/ci_test_partition.py \
            --shard "${{ matrix.shard }}" \
            --format nul > "$selection_file"
          mapfile -d '' -t test_files < "$selection_file"
          if (( ${#test_files[@]} == 0 )); then
            echo "No tests selected for shard ${{ matrix.shard }}" >&2
            exit 1
          fi
          python -m pytest -q "${test_files[@]}"

  oracle-parity:
    # Runs on every push and pull request, not on request.
    #
    # The morphology instrument's headline claim is that OSMnx parity is checked
    # rather than asserted. A job that only fires on manual dispatch leaves that
    # claim unenforced, which is the same shape as the defect the instrument work
    # exists to remove: a guarantee nobody re-derives. The ~28 MB of geo wheels
    # buy the one thing that makes the claim true, and they stay out of the
    # default `test` job so the everyday suite remains dependency-free.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the oracle extra
        run: python -m pip install -e ".[dev,oracle]"

      # Parity is re-derived, not trusted: the committed golden values must be
      # reproducible from a pinned OSMnx against the committed .osm fixtures.
      # Reading local files only — osm_import performs no network access
      # (spec 039 FR-001).
      - name: Re-derive the oracle from the committed fixtures and compare
        run: python tools/regen_osmnx_oracle.py --check

      - name: Run the parity assertions
        run: python -m pytest tests/test_osmnx_oracle.py tests/test_morphology_oracle_parity.py -q

  audit-gallery:
    # The committed SVG gallery is regenerated and compared byte-for-byte.
    #
    # Without this it would be exactly what the deleted PNGs were: pictures of a
    # generator, committed once, drifting quietly out of agreement with the code
    # that made them until a reviewer opens one and sees something that no longer
    # exists. Re-deriving it is the only thing that keeps the gallery honest, and
    # it is cheap because the renderer needs no browser and no plotting library.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Re-render the audit gallery and compare
        run: python tools/render_audit_maps.py --check

      - name: Re-render the scalable morphology gallery and compare
        run: python tools/render_morphology_gallery.py --check

  ci-gate:
    name: ci gate
    if: ${{ always() }}
    needs: [test-partition, test, oracle-parity, audit-gallery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI surface to pass
        env:
          PARTITION_RESULT: ${{ needs.test-partition.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ORACLE_RESULT: ${{ needs.oracle-parity.result }}
          GALLERY_RESULT: ${{ needs.audit-gallery.result }}
        run: |
          for result in \
            "$PARTITION_RESULT" \
            "$TEST_RESULT" \
            "$ORACLE_RESULT" \
            "$GALLERY_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "Required CI surface did not pass: $result" >&2
              exit 1
            fi
          done
